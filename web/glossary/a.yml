# Stream A glossary: one term per line, "izraz: razlaga". Lowercase term.
obrestna mera: Cena izposojanja denarja. Ko jo centralna banka (v ZDA Fed) zviša, je posojilo dražje in podjetja pogosto varčujejo.
napoved odpuščanja: Javna novica, da bo podjetje odpustilo del zaposlenih. Napoved ni isto kot dejansko odpuščanje.
nenavadni donos: Sprememba cene delnice, ki je ne pojasni gibanje celotne borze tisti dan.
hipoteza: Trditev, ki jo zapišemo vnaprej in jo s podatki potrdimo ali ne.
p-vrednost: Kako verjeten bi bil tako velik učinek, če ga v resnici ne bi bilo. Manjša je, močnejši je dokaz.
interval zaupanja: Razpon, v katerem verjetno leži prava vrednost. Če vključuje nič, učinka ne moremo dokazati.
vnaprejšnja registracija: Hipoteze in teste zapišemo, preden vidimo rezultate, da jih ne moremo prilagoditi podatkom.
placebo test: Isti test tam, kjer učinka ne bi smelo biti. Pokaže, kako pogosto test zmotno najde nekaj.
