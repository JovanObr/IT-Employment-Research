# Stream B glossary: one term per line, "izraz: razlaga". Lowercase term. Do not repeat a term from a.yml.
hacker news: Spletni forum programerjev. Vsak mesec podjetja v niti »Who is hiring?« objavijo, koga iščejo; od 2015 do 2026 je to okoli 81.500 objav.
it storitve: Panoga računalniškega programiranja, svetovanja in upravljanja računalniških sistemov (ameriška koda 5415). Ne vključuje velikih podjetij, ki prodajajo lastne programe.
mestno območje: Mesto skupaj z okoliškimi kraji, iz katerih ljudje vsak dan hodijo tja na delo (v ZDA »metro area«).
strokovnjak ikt: Zaposleni, ki dela z informacijskimi in komunikacijskimi tehnologijami, na primer programer, sistemski skrbnik ali analitik. Šteje jih Eurostat v anketi o delovni sili.
regresija k povprečju: Če je meritev enkrat po naključju visoka, je naslednja praviloma nižja. Zato lahko navidezno »dohitevanje« vidimo tudi tam, kjer ga ni.
